<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO -->
    <title>Fresh Save — Discover Local Stores & Products Near You</title>
    <meta name="description" content="Fresh Save is an Android app that connects you with stores and products right around your location. Download the APK and start shopping locally." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fresh Save — Discover Local Stores & Products Near You" />
    <meta property="og:description" content="Discover nearby stores, explore products and find better local deals — all from one simple app." />

    <meta property="og:url" content="https://freshsave.app" />
    <meta property="og:site_name" content="Fresh Save" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fresh Save — Discover Local Stores & Products Near You" />
    <meta name="twitter:description" content="Discover nearby stores, explore products and find better local deals — all from one simple app." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#2ea233" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
